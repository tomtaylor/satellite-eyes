		E2B80DDF199F6DFA002CD817 /* Update Build Number */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Update Build Number";
			shellPath = /bin/sh;
			shellScript = (
				"# From: http://zargony.com/2014/08/10/automatic-versioning-in-xcode-with-git-describe",
				"set -e",
				"set -x",
				"BUILD_NUMBER=`git rev-list HEAD | wc -l | tr -d ' '`",
				"# We increment this by 1000 because I did something stupid with an old release, and if the build number isn't higher than 438 then Sparkle won't prompt for an upgrade.",
				"((BUILD_NUMBER+=1000))",
				"echo \"Updating Info.plist CFBundleVersion to: ${BUILD_NUMBER}\"",
				"/usr/libexec/PlistBuddy -c \"Set :CFBundleVersion \\\"${BUILD_NUMBER}\\\"\" \"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"",
				"/usr/bin/plutil -convert binary1 \"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

